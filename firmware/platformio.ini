; =====================================================================
;  ESP32-2432S028 (CYD) 皮卡丘天气钟 —— PlatformIO 工程配置
;  横屏 320x240 / 5 页面 / 蓝白界面(皮卡丘精灵保留自身配色)
; =====================================================================

[env:cyd]
platform  = espressif32@6.5.0
board     = esp32dev
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, direct
; 这块板的 CH340/当前 USB 链路在 460800 会偶发掉线，115200 更稳。
upload_speed    = 115200

; 程序较大(BLE + WiFi + 字体),用无 OTA 的大 app 分区
board_build.partitions = huge_app.csv

; U8g2_for_TFT_eSPI 不在这里 —— 它 vendor 在 lib/U8g2_for_TFT_eSPI/,
; LDF 会自动找到。原因见那个目录的 README:上游 library.properties 里
; 写着 depends=TFT_eSPI Library,而这个包名在注册表里不存在,每次构建都会
; 联网找一个找不到的包,网一断就硬失败。里面只留了用到的字体(同参考工程)。
; 也别再装 olikraus/U8g2 —— 字体符号会重复定义。
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^2.3.0
    bblanchon/ArduinoJson@^7.1.0

; ---------------------------------------------------------------------
;  TFT_eSPI 引脚配置(编译宏注入,不改 User_Setup.h)
;  ESP32-2432S028 的固定硬件连线
; ---------------------------------------------------------------------
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; 字体:只留实际用到的,省 flash
    ;   GLCD=极小号 ASCII, FONT2=小号, FONT4=中号数字/ASCII
    ;   大号时间数字是手绘抗锯齿图元,不需要 FONT6/7/8
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; 中文字体由 U8g2_for_TFT_eSPI 提供(点阵 wqy12/16)
    -D CJK_U8G2=1

; =====================================================================
;  预览/演示环境:假频谱 + 假歌词 + 假天气,不连 WiFi/蓝牙
;  没有手机时验证界面用,不要烧到日常使用的板子
; =====================================================================
[env:cyd-demo]
extends     = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -D DEMO_MODE=1
